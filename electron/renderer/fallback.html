<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Rhine Music</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b0f;
    --ink: #e8e8ed;
    --muted: #9a9aa5;
    --accent: #fa2b56;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink);
    font: 15px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .card { max-width: 560px; padding: 40px; text-align: center; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 12px; }
  p { color: var(--muted); margin: 0 0 8px; }
  code {
    display: inline-block; margin-top: 12px; padding: 8px 14px;
    background: #1a1a20; border-radius: 8px; font-size: 12.5px;
    color: var(--ink); word-break: break-all; user-select: all;
  }
  .accent { color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <h1>音乐库服务未能启动</h1>
    <p>应用窗口已打开，但本地的音乐库服务没有就绪，无法加载界面。</p>
    <p>常见原因：端口被占用、构建产物缺失、或数据目录没有写入权限。</p>
    <p>服务日志位于：</p>
    <code id="log">%APPDATA%\rhine-music-windows\logs\player-service.log</code>
    <p style="margin-top:24px">
      <span class="accent">提示：</span>修改端口或 GPU 设置后需要重启应用才会生效。
    </p>
  </div>
</body>
</html>
