name: 功能建议
description: 提出新功能或改进想法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 先说问题，别直接说方案 —— 这样讨论空间更大
      placeholder: 例如：我的曲库有20 多个目录，每次换机器都要重新设置
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
      placeholder: 简要描述即可
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及区域
      options:
        - 音乐库 / 导入
        - 播放
        - 界面 / 动效
        - 性能
        - GPU / 图形
        - 打包 / 分发
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案
      description: 哪怕行不通，写出来能避免重复讨论

  - type: checkboxes
    id: upstream
    attributes:
      label: 上游关系
      options:
        - label: 这个想法同样适用于上游 Web 版（而非仅桌面版）
