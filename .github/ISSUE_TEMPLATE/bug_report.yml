name: Bug 报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。**动效卡顿 / 3D 不流畅类问题请先看下方「环境」里的显卡信息**，
        并尝试把动效性能模式切到「优先帧率」、或关闭硬件加速，
        这能帮我们快速区分是渲染性能还是功能缺陷。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题现象
      description: 描述发生了什么，以及你期望的行为
      placeholder: 例如：导入文件夹后专辑数显示为 0，但文件夹里确实有 mp3
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动应用
        2. 打开设置 → 音乐库
        3. 点击「添加文件夹」，选择 D:\Music
        4. 专辑列表仍为空
    validations:
      required: true

  - type: input
    id: error-message
    attributes:
      label: 错误信息
      description: 从 `%APPDATA%\rhine-music-windows\logs\player-service.log` 复制相关行
      render: text

  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 这些信息对定位问题很关键
    validations:
      required: true
    value: |
      - Windows 版本：
      - 显卡型号：
      - 显卡驱动版本：
      - 应用版本（设置 → 关于）：
      - 安装方式：安装版 / 便携版 / 源码运行

  - type: input
    id: port
    attributes:
      label: 端口
      description: 设置里配置的服务端口（默认 5178）
      default: '5178'

  - type: textarea
    id: workarounds
    attributes:
      label: 已尝试的排查
      description: 例如切优先帧率、关硬件加速、换端口、改动效设置
